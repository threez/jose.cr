name: jose
version: 1.3.0
description: >
  JSON Object Signing and Encryption (JOSE) for Crystal — JWS, JWE, JWT,
  and JWKS backed by OpenSSL, covering RFC 7515–7520.

authors:
  - Vincent Landgraf <vincent@landgrafx.de>

crystal: '>= 1.19.1'

license: MIT

dependencies:
  ed25519:
    github: spider-gazelle/ed25519
    version: ~> 1.1

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.6.0
